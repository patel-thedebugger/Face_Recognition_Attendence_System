<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <title>Faculty - Take Attendance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <style>
    body { font-family: 'Manrope', sans-serif; }
  </style>
</head>

<body class="bg-slate-100 min-h-screen">

<div class="flex min-h-screen">

  <!-- SIDEBAR -->
  <aside class="w-64 bg-white border-r p-6 hidden lg:block">
    <h2 class="text-xl font-extrabold text-blue-900 mb-8">Faculty Portal</h2>

    <nav class="space-y-3">
      <a class="flex items-center gap-3 px-4 py-3 rounded-xl bg-blue-900 text-white">
        <span class="material-symbols-outlined">fact_check</span>
        Take Attendance
      </a>

      <a class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-100">
        <span class="material-symbols-outlined">history</span>
        Attendance History
      </a>

      <a class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-100">
        <span class="material-symbols-outlined">menu_book</span>
        My Subjects
      </a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="flex-1 p-8">
    <div class="max-w-5xl mx-auto space-y-8">

      <!-- HEADER -->
      <div>
        <h1 class="text-3xl font-extrabold text-slate-800">Take Attendance</h1>
        <p class="text-slate-500 mt-1">Select subject and mark student attendance</p>
      </div>

      <form method="post" enctype="multipart/form-data"> 
        {# <!-- action="{% url 'take_attendance' %}"👆 --> #}
        {% csrf_token %}

        <!-- SUBJECT & SESSION -->
        <div class="bg-white p-6 rounded-2xl shadow border space-y-6">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

            <!-- SUBJECT -->
            <select name="subject" required class="rounded-xl border-slate-300 p-3">
                <option value="">Select Subject</option>
                {% for fs in faculty_subjects %}
                <option value="{{ fs.subject.id }}">
                    {{ fs.subject.subject_code }} - {{ fs.subject.subject_name }}
                </option>
                {% endfor %}
            </select>

            <!-- SESSION TYPE -->
            <select name="session_type" required class="rounded-xl border-slate-300 p-3">
                <option value="">Session Type</option>
                <option value="theory">Theory</option>
                <option value="lab">Lab</option>
            </select>

            <!-- BATCH -->
            <select name="batch" class="rounded-xl border-slate-300 p-3">
                <option value="">Batch (Lab Only)</option>
                {% for batch in batches %}
                <option value="{{ batch.id }}">{{ batch.batch_name }}</option>
                {% endfor %}
            </select>

            </div>

            <!-- MODE -->
            <div class="flex gap-6">
            <label class="flex items-center gap-2">
                <input type="radio" name="mode" value="manual" checked>
                Manual Attendance
            </label>

            <label class="flex items-center gap-2">
                <input type="radio" name="mode" value="face">
                Face Attendance (Video)
            </label>
            </div>

            <!-- VIDEO -->
            <div>
            <label class="text-xs font-bold text-slate-500 uppercase">
                Upload Lecture Video
            </label>
            <input type="file" name="video" accept="video/*"
                    class="w-full mt-1 p-3 rounded-xl bg-slate-50 border">
            </div>

        </div>

        <!-- STUDENTS -->
        <div class="bg-white p-6 rounded-2xl shadow border mt-6">
            <h2 class="text-lg font-bold text-slate-700 mb-4">Students</h2>

            <div class="space-y-3 max-h-64 overflow-y-auto">
            {% for student in students %}
                <label class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-50">
                <input type="checkbox" name="students[]" value="{{ student.id }}">
                <span>{{ student.roll_no }} - {{ student.name }}</span>
                </label>
            {% endfor %}
            </div>
        </div>

        <!-- SUBMIT -->
        <button
            type="submit"
            class="w-full mt-6 py-4 bg-blue-900 text-white font-bold rounded-xl shadow-lg hover:scale-[1.01] transition">
            Submit Attendance
        </button>

        </form>

    </div>
  </main>

</div>

</body>
</html>
