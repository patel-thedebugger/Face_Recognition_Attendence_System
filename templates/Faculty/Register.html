<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Registration | Pacific State University</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2e799e",
                        "background-light": "#f9fafb",
                        "background-dark": "#182125",
                    },
                    fontFamily: {
                        display: ["Manrope", "sans-serif"]
                    },
                },
            },
        }
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-display">

{% include 'nav.html' %}

<main class="flex-grow flex items-center justify-center p-6">
    <div class="w-full max-w-xl bg-white dark:bg-background-dark rounded-xl shadow-2xl p-10 border border-primary/10">

        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-[#121517] dark:text-white mb-2">
                Faculty Registration
            </h2>
            <p class="text-gray-500 dark:text-gray-400">
                Create your faculty account to access the portal
            </p>
        </div>

        <form class="space-y-6">
            <!-- Full Name -->
            <div>
                <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
                    Full Name
                </label>
                <input type="text" placeholder="Dr. John Doe"
                    class="w-full h-12 rounded-lg border border-gray-300 dark:border-gray-700 px-4 focus:ring-2 focus:ring-primary"/>
            </div>

            <!-- Faculty ID -->
            <div>
                <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
                    Faculty ID
                </label>
                <input type="text" placeholder="FAC12345"
                    class="w-full h-12 rounded-lg border border-gray-300 dark:border-gray-700 px-4 focus:ring-2 focus:ring-primary"/>
            </div>

            <!-- Email -->
            <div>
                <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
                    Official Email
                </label>
                <input type="email" placeholder="faculty@psu.edu"
                    class="w-full h-12 rounded-lg border border-gray-300 dark:border-gray-700 px-4 focus:ring-2 focus:ring-primary"/>
            </div>

            <!-- Password -->
            <div>
                <label class="text-sm font-semibold text-gray-700 dark:text-gray-200">
                    Password
                </label>
                <input type="password" placeholder="••••••••"
                    class="w-full h-12 rounded-lg border border-gray-300 dark:border-gray-700 px-4 focus:ring-2 focus:ring-primary"/>
            </div>

            <!-- Register Button -->
            <button type="submit"
                class="w-full h-12 bg-primary text-white font-bold rounded-lg hover:bg-primary/90 transition">
                Register Account
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-gray-500 dark:text-gray-400">
            Already have an account?
            <a href="{% url 'FacultyLogin_view' %}" class="text-primary font-bold hover:underline">
                Sign In
            </a>
        </div>

    </div>
</main>

<footer class="py-6 text-center text-xs text-gray-400">
    © 2024 CVM University
</footer>

</body>
</html>
